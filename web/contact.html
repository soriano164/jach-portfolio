<section id="contact" class="contact-section">
    <div class="container contact-container">
        
        <!-- Left: Designer Pitch Elements -->
        <div class="contact-info-panel" data-aos="fade-right">
            <h2 class="section-title text-left">
                Let's craft <br> something <br> <span class="text-gradient">beautiful.</span>
            </h2>
            <p class="contact-pitch">
                From striking brand identities to modern user interfaces, I am ready to translate your ideas into compelling visual stories. Let’s collaborate and bring your creative vision to life.
            </p>
            
            <div class="contact-direct">
                <div class="direct-item">
                    <span class="direct-label">Inquiries</span>
                    <a href="mailto:hello@jacqui.design" class="direct-link">Jacques@gmail.com</a>
                </div>
                <div class="direct-item">
                    <span class="direct-label">Location</span>
                    <span class="direct-text">Philippines, Available Remotely</span>
                </div>
            </div>
        </div>

        <!-- Right: The Interactive Form -->
        <div class="contact-form-panel glass-panel" data-aos="fade-left" data-aos-delay="200">
            <form class="contact-form">
                
                <!-- Specialized Design Scope Selector -->
                <div class="project-type-wrapper">
                    <label class="input-label">What are we designing?</label>
                    <div class="custom-radios">
                        <label class="radio-pill">
                            <input type="radio" name="project_type" value="branding" checked>
                            <span>Branding</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="project_type" value="uiux">
                            <span>UI/UX Design</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="project_type" value="editorial">
                            <span>Editorial</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="project_type" value="other">
                            <span>Other</span>
                        </label>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="name" class="input-label">Name</label>
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="email" class="input-label">Email</label>
                        <input type="email" id="email" placeholder="john@example.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="message" class="input-label">Project Details</label>
                    <textarea id="message" rows="4" placeholder="Tell me about your vision, goals, and timeline..." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary submit-btn">
                    Send Inquiry <i class="fa-solid fa-paper-plane" style="margin-left: 8px;"></i>
                </button>
            </form>
        </div>
        
    </div>
</section>
